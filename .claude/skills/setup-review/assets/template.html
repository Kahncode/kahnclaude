<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header with subpage tabs; overview = ranked checklist; report pages = rendered markdown + section jump list */
:root {
  --bg: #f5f7f8; --surface: #ffffff; --fg: #17222b; --muted: #5b6a75; --line: #dce3e8;
  --accent: #0f6e78; --accent-soft: #e0f0f1; --code-bg: #eef2f4;
  --crit: #b3261e; --crit-soft: #fbe9e7; --warn: #8a5a00; --warn-soft: #fbf0d9;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11171c; --surface: #172028; --fg: #e3eaef; --muted: #93a3ae; --line: #2a3640;
  --accent: #5cc3cc; --accent-soft: #163338; --code-bg: #1d2830;
  --crit: #f28b82; --crit-soft: #3a1d1b; --warn: #e5b85c; --warn-soft: #33290f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11171c; --surface: #172028; --fg: #e3eaef; --muted: #93a3ae; --line: #2a3640;
  --accent: #5cc3cc; --accent-soft: #163338; --code-bg: #1d2830;
  --crit: #f28b82; --crit-soft: #3a1d1b; --warn: #e5b85c; --warn-soft: #33290f; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 15px/1.6 var(--f-body) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 1120px; margin: 0 auto }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
header .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px; padding-block: 10px 0 }
.brand { font: 700 17px/1.2 var(--f-display); letter-spacing: -.01em; padding-bottom: 10px }
.brand small { display: block; font: 500 11px var(--f-mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase }
nav { display: flex; gap: 2px; overflow-x: auto; flex: 1 1 auto; min-width: 0; scrollbar-width: thin }
nav a { white-space: nowrap; padding: 8px 12px 10px; color: var(--muted); text-decoration: none; font-weight: 500; font-size: 14px; border-bottom: 2px solid transparent }
nav a:hover { color: var(--fg) }
nav a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent) }
nav a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
main { padding-block: 28px 64px }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.2 }
h1 { font-size: 30px; margin: 0 0 8px; letter-spacing: -.015em }
.lede { color: var(--muted); max-width: 68ch; margin: 0 0 22px }
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px }
.stat { font: 500 12px var(--f-mono); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; color: var(--muted) }
.stat b { color: var(--fg); font-weight: 600 }
.alert { background: var(--crit-soft); border-left: 4px solid var(--crit); border-radius: 4px; padding: 14px 16px; margin-bottom: 28px; max-width: 80ch }
.alert strong { color: var(--crit) }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 18px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px }
.toolbar span { color: var(--muted); font-size: 13px; flex: 1 1 220px }
.toolbar output { font: 500 13px var(--f-mono); color: var(--fg); flex-basis: 100%; overflow-wrap: anywhere }
button { font: 600 13px var(--f-body); color: var(--surface); background: var(--accent); border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer }
button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line) }
.batch { margin-bottom: 30px }
.batch h2 { font-size: 19px; margin: 0 0 4px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap }
.batch h2 .tag { font: 500 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.batch > p { margin: 0 0 12px; color: var(--muted); max-width: 75ch }
.items { display: grid; gap: 8px }
.item { display: grid; grid-template-columns: auto 2.2em 1fr; gap: 0 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px }
.item.sev-crit { border-left: 4px solid var(--crit) }
.item.sev-high { border-left: 4px solid var(--warn) }
.item input { margin-top: 5px; width: 16px; height: 16px; accent-color: var(--accent) }
.item .num { font: 600 13px/1.9 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums }
.item .body { min-width: 0 }
.item .title { font-weight: 600; margin: 0 }
.item .detail { margin: 4px 0 0; font-size: 14px }
.item .detail ul { margin: 4px 0 0; padding-left: 18px }
.item .src { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px }
.chip { font: 500 11px var(--f-mono); text-decoration: none; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 2px 7px }
.chip:hover { text-decoration: underline }
.item.done { opacity: .55 }
.item.done .title { text-decoration: line-through }
code { font: 0.86em var(--f-mono); background: var(--code-bg); border-radius: 4px; padding: 1px 5px; overflow-wrap: anywhere }
pre { background: var(--code-bg); border-radius: 6px; padding: 12px; overflow-x: auto }
pre code { background: none; padding: 0; overflow-wrap: normal }
.report-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; align-items: start }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); font-size: 13px; max-height: calc(100vh - 100px); overflow-y: auto }
.toc p { font: 500 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px }
.toc button { display: block; width: 100%; text-align: left; background: none; color: var(--muted); font: 500 13px/1.35 var(--f-body); padding: 5px 8px; border-radius: 4px }
.toc button:hover { background: var(--accent-soft); color: var(--fg) }
.report-head { margin-bottom: 18px }
.md { min-width: 0 }
.md h1 { font-size: 24px }
.md h2 { font-size: 20px; margin: 32px 0 10px; padding-top: 12px; border-top: 1px solid var(--line) }
.md h3 { font-size: 16px; margin: 22px 0 8px }
.md p, .md li { max-width: 80ch }
.md blockquote { margin: 12px 0; padding: 10px 14px; border-left: 4px solid var(--warn); background: var(--warn-soft); border-radius: 4px }
.md blockquote p { margin: 0 }
.tbl { overflow-x: auto; margin: 12px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface) }
.md table { border-collapse: collapse; font-size: 13px; width: 100%; min-width: 640px }
.md th, .md td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line) }
.md th { font-weight: 600; background: var(--code-bg) }
.md tr:last-child td { border-bottom: 0 }
.md a { color: var(--accent) }
@media (max-width: 820px) {
  .report-layout { grid-template-columns: minmax(0, 1fr) }
  .toc { position: static; max-height: none; border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--surface) }
  h1 { font-size: 25px }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth } }
</style>

<header class="gut">
  <div class="wrap">
    <div class="brand" id="brand"></div>
    <nav id="nav" aria-label="Subpages"></nav>
  </div>
</header>

<main class="gut">
  <div class="wrap">
    <section id="view-overview">
      <h1 id="heading"></h1>
      <p class="lede" id="lede"></p>
      <div class="stats" id="stats"></div>
      <div class="alert" id="alert" hidden></div>
      <div class="toolbar">
        <span>Tick what you want applied, then copy the request and paste it back into Claude Code. Ticks are saved in this browser only.</span>
        <button type="button" id="copy">Copy request</button>
        <button type="button" class="ghost" id="clear">Clear ticks</button>
        <output id="out" aria-live="polite"></output>
      </div>
      <div id="batches"></div>
    </section>
    <section id="view-report" hidden>
      <div class="report-head"><h1 id="rep-title"></h1><p class="lede" id="rep-lede"></p></div>
      <div class="report-layout">
        <aside class="toc" id="toc" aria-label="Sections"></aside>
        <article class="md" id="md"></article>
      </div>
    </section>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const DATA = /*__DATA__*/;
const REPORTS = DATA.reports;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const KEY = "setup-review-ticks-" + DATA.subtitle;

function renderShell() {
  document.getElementById("brand").innerHTML = `${esc(DATA.title)}<small>${esc(DATA.subtitle)}</small>`;
  document.getElementById("nav").innerHTML = `<a href="#overview">Overview</a>` + Object.entries(REPORTS).map(([k, r]) => `<a href="#${k}">${esc(r.tab || r.title)}</a>`).join("");
  document.getElementById("heading").textContent = DATA.heading;
  document.getElementById("lede").textContent = DATA.lede;
  document.getElementById("stats").innerHTML = (DATA.stats || []).map(([n, l]) => `<span class="stat"><b>${esc(n)}</b> ${esc(l)}</span>`).join("");
  if (DATA.alert) { const a = document.getElementById("alert"); a.innerHTML = DATA.alert; a.hidden = false; }
}
function loadTicks() { try { return new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) { return new Set(); } }
function saveTicks(s) { try { localStorage.setItem(KEY, JSON.stringify([...s])); } catch (e) { /* per-viewer convenience only */ } }
const ticks = loadTicks();
function itemHtml(it) {
  const src = (it.src || []).filter(s => REPORTS[s]).map(s => `<a class="chip" href="#${s}">${esc(REPORTS[s].tab || REPORTS[s].title)}</a>`).join("");
  return `<div class="item ${it.sev ? "sev-" + it.sev : ""} ${ticks.has(it.n) ? "done" : ""}" data-n="${it.n}">
    <input type="checkbox" id="t${it.n}" aria-label="Apply item ${it.n}" ${ticks.has(it.n) ? "checked" : ""}>
    <span class="num">${String(it.n).padStart(2, "0")}</span>
    <div class="body"><label class="title" for="t${it.n}">${it.title}</label><div class="detail">${it.detail}</div><div class="src">${src}</div></div></div>`;
}
function renderBatches() {
  document.getElementById("batches").innerHTML = DATA.batches.map(b => `<section class="batch"><h2><span class="tag">Batch ${esc(b.id)}</span>${esc(b.name)}</h2><p>${esc(b.note || "")}</p><div class="items">${b.items.map(itemHtml).join("")}</div></section>`).join("");
}
document.getElementById("batches").addEventListener("change", e => {
  const item = e.target.closest(".item"); if (!item) return;
  const n = Number(item.dataset.n);
  e.target.checked ? ticks.add(n) : ticks.delete(n);
  item.classList.toggle("done", e.target.checked);
  saveTicks(ticks);
});
function requestText() {
  const all = DATA.batches.flatMap(b => b.items);
  const list = all.filter(it => ticks.has(it.n));
  if (!list.length) return "";
  const plain = h => { const d = document.createElement("div"); d.innerHTML = h; return d.textContent; };
  return `From the setup review (${DATA.subtitle}), apply these items:\n` + list.map(it => `${it.n}. ${plain(it.title)}`).join("\n");
}
document.getElementById("copy").addEventListener("click", () => {
  const out = document.getElementById("out"); const text = requestText();
  if (!text) { out.textContent = "Tick at least one item first."; return; }
  const show = () => { out.textContent = text.replace(/\n/g, " · "); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => { out.textContent = "Copied: " + text.split("\n").slice(1).map(s => s.split(".")[0]).join(", "); }, show); else show();
});
document.getElementById("clear").addEventListener("click", () => { ticks.clear(); saveTicks(ticks); renderBatches(); document.getElementById("out").textContent = ""; });

marked.use({ renderer: { html(h) { return esc(typeof h === "string" ? h : (h && h.text) || ""); } } });
const rendered = {};
function showReport(key) {
  const r = REPORTS[key];
  document.getElementById("rep-title").textContent = r.title;
  document.getElementById("rep-lede").textContent = r.lede || "";
  const md = document.getElementById("md");
  if (!rendered[key]) {
    const tmp = document.createElement("div"); tmp.innerHTML = marked.parse(r.md);
    tmp.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tbl"; t.replaceWith(w); w.appendChild(t); });
    tmp.querySelectorAll("a[href]").forEach(a => { if (!/^https?:/.test(a.getAttribute("href"))) a.removeAttribute("href"); });
    rendered[key] = tmp.innerHTML;
  }
  md.innerHTML = rendered[key];
  const heads = [...md.querySelectorAll("h2")];
  const toc = document.getElementById("toc");
  toc.innerHTML = heads.length ? "<p>Sections</p>" + heads.map((h, i) => `<button type="button" data-i="${i}">${esc(h.textContent)}</button>`).join("") : "";
  toc.onclick = e => { const b = e.target.closest("button"); if (b) heads[Number(b.dataset.i)].scrollIntoView(); };
}
function route() {
  const key = (location.hash || "#overview").slice(1);
  const isReport = Object.prototype.hasOwnProperty.call(REPORTS, key);
  document.getElementById("view-overview").hidden = isReport;
  document.getElementById("view-report").hidden = !isReport;
  if (isReport) showReport(key);
  const current = "#" + (isReport ? key : "overview");
  document.querySelectorAll("#nav a").forEach(a => { if (a.getAttribute("href") === current) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  window.scrollTo(0, 0);
}
renderShell();
renderBatches();
window.addEventListener("hashchange", route);
route();
</script>
